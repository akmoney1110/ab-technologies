server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html;

    index index.html;


    # ============================================================
    # STATIC VITE ASSETS
    # ============================================================

    location /assets/ {
        try_files $uri =404;

        expires 1y;

        add_header Cache-Control "public, immutable";
    }


    # ============================================================
    # SEO / PUBLIC FILES
    # ============================================================

    location = /robots.txt {
        try_files $uri =404;

        default_type text/plain;

        expires 1h;
    }


    location = /sitemap.xml {
        try_files $uri =404;

        default_type application/xml;

        expires 1h;
    }


    # ============================================================
    # REACT + PRERENDERED ROUTES
    # ============================================================

    location / {
        /*
         * Lookup order:
         *
         * 1. Real static file
         *
         * 2. Exact path
         *
         * 3. Prerendered:
         *      /services/hardware-procurement/index.html
         *
         * 4. Standard SPA fallback
         *
         * This means public SEO pages receive prerendered HTML,
         * while private/dynamic React routes continue working.
         */

        try_files
            $uri
            $uri/
            $uri/index.html
            /index.html;
    }


    # ============================================================
    # SECURITY HEADERS
    # ============================================================

    add_header X-Content-Type-Options "nosniff" always;

    add_header X-Frame-Options "SAMEORIGIN" always;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}