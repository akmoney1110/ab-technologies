server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ============================================================
    # BASIC SERVER SETTINGS
    # ============================================================

    charset utf-8;

    # Hide Nginx version information.
    server_tokens off;


    # ============================================================
    # COMPRESSION
    # ============================================================

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/manifest+json
        image/svg+xml;


    # ============================================================
    # VITE HASHED ASSETS
    # ============================================================
    #
    # Vite generates fingerprinted assets such as:
    #
    # /assets/index-BxcfHjMZ.js
    # /assets/index-CSFOFhXG.css
    #
    # Because the filename changes whenever the content changes,
    # these files can safely be cached for a long time.
    #
    # ============================================================

    location /assets/ {
        try_files $uri =404;

        expires 1y;

        add_header Cache-Control "public, max-age=31536000, immutable";

        access_log off;
    }


    # ============================================================
    # ROBOTS.TXT
    # ============================================================

    location = /robots.txt {
        try_files /robots.txt =404;

        default_type text/plain;

        expires 1h;

        add_header Cache-Control "public, max-age=3600";
    }


    # ============================================================
    # SITEMAP.XML
    # ============================================================

    location = /sitemap.xml {
        try_files /sitemap.xml =404;

        default_type application/xml;

        expires 1h;

        add_header Cache-Control "public, max-age=3600";
    }


    # ============================================================
    # FAVICON
    # ============================================================

    location = /favicon.svg {
        try_files /favicon.svg =404;

        expires 7d;

        add_header Cache-Control "public, max-age=604800";

        access_log off;
    }


    location = /favicon.ico {
        try_files /favicon.ico =404;

        expires 7d;

        add_header Cache-Control "public, max-age=604800";

        access_log off;
    }


    # ============================================================
    # APPLE TOUCH ICON
    # ============================================================

    location = /apple-touch-icon.png {
        try_files /apple-touch-icon.png =404;

        expires 7d;

        add_header Cache-Control "public, max-age=604800";

        access_log off;
    }


    # ============================================================
    # STATIC IMAGES / FONTS / MEDIA
    # ============================================================
    #
    # Cache normal static resources.
    #
    # Do NOT use immutable here because some files in /public may
    # keep the same filename when replaced.
    #
    # ============================================================

    location ~* \.(?:png|jpg|jpeg|gif|webp|avif|svg|ico|woff|woff2|ttf|otf)$ {
        try_files $uri =404;

        expires 30d;

        add_header Cache-Control "public, max-age=2592000";

        access_log off;
    }


    # ============================================================
    # PRERENDERED SEO PAGES + REACT SPA FALLBACK
    # ============================================================
    #
    # Example request:
    #
    # /services/hardware-procurement
    #
    # Nginx checks:
    #
    # 1. Is there an actual file matching the URL?
    #
    #       $uri
    #
    # 2. Is there a prerendered HTML document?
    #
    #       $uri/index.html
    #
    #    Example:
    #
    #       /services/hardware-procurement/index.html
    #
    # 3. If neither exists, serve the normal React application:
    #
    #       /index.html
    #
    # This allows:
    #
    # - Google to receive prerendered SEO HTML
    # - public pages to have unique titles/descriptions/H1s
    # - React Router to continue handling private routes
    # - dynamic routes to continue working
    #
    # IMPORTANT:
    #
    # Do NOT put $uri/ before $uri/index.html here.
    #
    # ============================================================

    location / {
        try_files
            $uri
            $uri/index.html
            /index.html;
    }


    # ============================================================
    # HTML CACHE CONTROL
    # ============================================================
    #
    # JavaScript/CSS assets are fingerprinted and can be cached for
    # one year.
    #
    # HTML should NOT be cached aggressively because titles,
    # metadata, content and asset references can change after a
    # deployment.
    #
    # This regex catches:
    #
    # /index.html
    # /services/.../index.html
    # etc.
    #
    # ============================================================

    location ~* \.html$ {
        expires -1;

        add_header Cache-Control "no-cache, no-store, must-revalidate";

        try_files $uri =404;
    }


    # ============================================================
    # SECURITY HEADERS
    # ============================================================

    add_header X-Content-Type-Options "nosniff" always;

    add_header X-Frame-Options "SAMEORIGIN" always;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    add_header Permissions-Policy
        "camera=(), microphone=(), geolocation=()"
        always;


    # ============================================================
    # ERROR HANDLING
    # ============================================================
    #
    # Do NOT redirect 404s to index.html here.
    #
    # React Router fallback is already handled above.
    #
    # ============================================================

    error_page 500 502 503 504 /index.html;
}