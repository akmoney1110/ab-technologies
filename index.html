<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />

    <!-- =====================================================
         BASIC
    ====================================================== -->

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#020611" />

    <meta name="color-scheme" content="dark light" />

    <!-- =====================================================
         PRIMARY SEO
    ====================================================== -->

    <title>
      AB Technologies | IT Procurement, Software, Cloud, AI & Technology Solutions
    </title>

    <meta
      name="description"
      content="AB Technologies provides IT hardware procurement, custom software development, networking, cloud infrastructure, cybersecurity, AI automation and managed technology services for businesses and organizations."
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />

    <meta
      name="author"
      content="AB Technologies"
    />

    <link
      rel="canonical"
      href="https://abtechbridge.com/"
    />

    <!-- =====================================================
         FAVICON / BROWSER ICONS
    ====================================================== -->

    <!-- Standard browser favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png?v=5"
    />

    <!-- High-resolution browser / Android icon -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/favicon-192x192.png?v=5"
    />

    <!-- Traditional favicon fallback -->
    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="/favicon.ico?v=5"
    />

    <!-- Apple / iPhone / iPad icon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png?v=5"
    />

    <!-- =====================================================
         OPEN GRAPH
    ====================================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="AB Technologies"
    />

    <meta
      property="og:title"
      content="AB Technologies | Technology. Simplified."
    />

    <meta
      property="og:description"
      content="IT procurement, software development, networking, cloud infrastructure, cybersecurity, AI automation and managed technology solutions."
    />

    <meta
      property="og:url"
      content="https://abtechbridge.com/"
    />

    <meta
      property="og:image"
      content="https://abtechbridge.com/og-image.png"
    />

    <meta
      property="og:image:alt"
      content="AB Technologies"
    />

    <!-- =====================================================
         X / TWITTER
    ====================================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="AB Technologies | Technology. Simplified."
    />

    <meta
      name="twitter:description"
      content="IT procurement, software, networking, cloud, cybersecurity and AI solutions for modern organizations."
    />

    <meta
      name="twitter:image"
      content="https://abtechbridge.com/og-image.png"
    />

    <!-- =====================================================
         ORGANIZATION STRUCTURED DATA
    ====================================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://abtechbridge.com/#organization",
        "name": "AB Technologies",
        "url": "https://abtechbridge.com/",
        "logo": "https://abtechbridge.com/favicon-192x192.png",
        "description": "AB Technologies provides IT procurement, software development, networking, cloud infrastructure, cybersecurity, AI automation and managed technology solutions."
      }
    </script>

    <!-- =====================================================
         WEBSITE STRUCTURED DATA
    ====================================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://abtechbridge.com/#website",
        "url": "https://abtechbridge.com/",
        "name": "AB Technologies",
        "publisher": {
          "@id": "https://abtechbridge.com/#organization"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
